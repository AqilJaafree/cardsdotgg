[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
allow_paths = ["../shared"]
fs_permissions = [{ access = "read-write", path = "../shared" }, { access = "read-write", path = "../docs/agents" }]
gas_limit = "18446744073709551615"
memory_limit = 1073741824
remappings = [
  "@shared/=../shared/interfaces/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.invariant]
runs = 32
depth = 32
fail_on_revert = false

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
